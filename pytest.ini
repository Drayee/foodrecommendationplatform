[pytest]
DJANGO_SETTINGS_MODULE = RAGDjange.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *Test
addopts = -q --disable-warnings --maxfail=20 -p no:anyio
testpaths = RAGDjange food rag recommend websearch
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
