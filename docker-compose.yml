# ===========================================================
# 寻味 · 一键起服务（Django + PostgreSQL）
#
#   cp .env.example .env      # 填 AMAP_* / LLM_* 等
#   docker compose up -d --build
#   docker compose exec web python manage.py seed_data
#   docker compose exec web python manage.py build_index
#   open http://127.0.0.1:8000/
#
# 说明：
# - Ollama 与高德属外部服务。LLM 若跑在宿主机，用 host.docker.internal 指过去；
#   高德是公网 API，直接填 Key 即可。
# - 首次启动会自动 migrate；数据初始化按上面两条命令手动执行（幂等）。
# ===========================================================
services:
  db:
    image: postgres:18-alpine
    container_name: xunwei-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-food_platform}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-food_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "${DB_HOST_PORT:-5433}:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xunwei-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内统一用服务名访问数据库，覆盖 .env 里的 127.0.0.1
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      # Ollama 跑在宿主机时留这个地址；跑在别的容器就改成容器名
      LLM_BASE_URL: ${LLM_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn RAGDjange.wsgi:application
             --bind 0.0.0.0:8000 --workers 3 --threads 4
             --timeout 120 --access-logfile - --error-logfile -"
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - index_data:/app/data/index
      - app_logs:/app/logs

volumes:
  pgdata:
  index_data:
  app_logs:
